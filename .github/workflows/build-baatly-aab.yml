name: Build Baatly Release AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build-baatly-aab.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Find exactly one source ZIP
      # ------------------------------------------------------------
      - name: Find Baatly source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 3 -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          echo "ZIP files found:"
          printf '%s\n' "${ZIP_FILES[@]:-<none>}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE source ZIP."
            echo "Found ${#ZIP_FILES[@]} ZIP files."
            echo "Keep only the current Baatly User source ZIP in the repository."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Using source ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Extract source
      # ------------------------------------------------------------
      - name: Extract Baatly source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d source

          echo "Source extracted successfully."

          echo "Top-level extracted files:"
          find source -maxdepth 3 -type f \
            ! -path "*/build/*" \
            | sort \
            | head -200

      # ------------------------------------------------------------
      # 4. Locate Android project
      # ------------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW_FILES=()

          while IFS= read -r file; do
            GRADLEW_FILES+=("$file")
          done < <(
            find source -type f -name "gradlew" \
              ! -path "*/build/*" \
              | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -eq 0 ]; then
            echo "ERROR: gradlew not found."

            echo "Searching for Gradle project files:"
            find source -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              ! -path "*/build/*" \
              | sort

            exit 1
          fi

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Multiple gradlew files found:"
            printf '%s\n' "${GRADLEW_FILES[@]}"
            exit 1
          fi

          GRADLEW="${GRADLEW_FILES[0]}"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 5. Setup Java 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 6. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------------------------------------
      # 7. Install required Android SDK packages
      # ------------------------------------------------------------
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
                     "platforms;android-36.1" \
                     "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

          echo "Required Android SDK packages installed."

      # ------------------------------------------------------------
      # 8. Verify Android SDK
      # ------------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root not detected."
            exit 1
          fi

          test -d "$SDK_ROOT/platform-tools" || {
            echo "ERROR: platform-tools missing."
            exit 1
          }

          test -d "$SDK_ROOT/platforms/android-36.1" || {
            echo "ERROR: Android platform 36.1 missing."
            exit 1
          }

          test -d "$SDK_ROOT/build-tools/36.0.0" || {
            echo "ERROR: Build Tools 36.0.0 missing."
            exit 1
          }

          echo "Android SDK verification PASSED."

      # ------------------------------------------------------------
      # 9. Verify signing secrets
      # ------------------------------------------------------------
      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          test -n "${STORE_PASSWORD:-}" || {
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          }

          echo "Signing secrets verified."

      # ------------------------------------------------------------
      # 10. Decode release keystore
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/baatly-release.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH" || {
            echo "ERROR: Release keystore file is empty."
            exit 1
          }

          echo "Release keystore created."
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 11. Prepare Gradle
      # ------------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "./gradlew" || {
            echo "ERROR: gradlew missing."
            exit 1
          }

          chmod +x ./gradlew

          ./gradlew --version

      # ------------------------------------------------------------
      # 12. Build Release AAB
      # ------------------------------------------------------------
      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: ${{ env.keystore_path }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Baatly User Release AAB build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

          echo "Gradle Release AAB build completed."

      # ------------------------------------------------------------
      # 13. Locate AAB
      # ------------------------------------------------------------
      - name: Locate generated AAB
        id: aab
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t AAB_FILES < <(
            find . \
              -type f \
              -path "*/build/outputs/bundle/*/*.aab" \
              | sort
          )

          if [ "${#AAB_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No AAB generated."

            echo "Available build outputs:"
            find . -type f \
              -path "*/build/outputs/*" \
              | sort \
              | head -300

            exit 1
          fi

          echo "Generated AAB files:"
          printf '%s\n' "${AAB_FILES[@]}"

          # Use the first deterministic sorted AAB.
          AAB_FILE="${AAB_FILES[0]}"
          AAB_FILE="${AAB_FILE#./}"

          echo "Selected AAB:"
          echo "$AAB_FILE"

          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 14. Upload AAB
      # ------------------------------------------------------------
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.aab.outputs.aab_file }}
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 15. Upload mapping
      # ------------------------------------------------------------
      - name: Upload Baatly mapping files
        uses: actions/upload-artifact@v4
        with:
          name: baatly-mapping
          path: |
            ${{ steps.project.outputs.project_dir }}/**/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 30

      # ------------------------------------------------------------
      # 16. Final success
      # ------------------------------------------------------------
      - name: Build Success
        shell: bash
        run: |
          echo "=============================================="
          echo " BAATLY USER RELEASE AAB - SUCCESS"
          echo "=============================================="
          echo "Artifact: baatly-release-aab"
          echo "Android SDK platform: 36.1"
          echo "Android Build Tools: 36.0.0"
          echo "Java: 17"
          echo "=============================================="
