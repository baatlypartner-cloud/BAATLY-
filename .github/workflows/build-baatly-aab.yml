name: Build Baatly Release AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================================================
      # 2. Setup JDK 17
      #
      # IMPORTANT:
      # NO Gradle cache here.
      # The previous workflow failed because setup-java was
      # trying to detect Gradle dependency files and found none
      # at repository root.
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: none

      # =========================================================
      # 3. Verify Java
      # =========================================================
      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          echo "Java version:"
          java -version

      # =========================================================
      # 4. Setup Android SDK command line tools
      #
      # packages intentionally empty.
      # This prevents setup-android from installing its default
      # extra packages.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      # =========================================================
      # 5. Find sdkmanager
      # =========================================================
      - name: Find Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK root:"
          echo "$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            echo
            echo "Searching SDK:"
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # =========================================================
      # 6. Install required Android SDK packages
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # =========================================================
      # 7. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SDK directories..."

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "Android SDK verification passed."

      # =========================================================
      # 8. Find Gradle wrapper
      # =========================================================
      - name: Find Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 3 -type f | sort | head -n 300

          echo
          echo "Searching for gradlew..."

          GRADLEW_PATH="$(find . -type f -name gradlew -print | head -n 1 || true)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere in repository."

            echo
            echo "All possible Gradle files:"
            find . -type f \( \
              -name "gradlew" -o \
              -name "gradle-wrapper.properties" -o \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) -print || true

            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW_PATH")"

          echo "GRADLE_PROJECT_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW_PATH"

          echo "Gradle wrapper found:"
          echo "$GRADLEW_PATH"

      # =========================================================
      # 9. Verify Gradle
      # =========================================================
      - name: Verify Gradle
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle project directory:"
          pwd

          echo
          echo "Gradle wrapper:"
          ls -la ./gradlew

          echo
          echo "Gradle version:"
          ./gradlew --version

      # =========================================================
      # 10. Check signing secrets
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          }

          echo "All signing secrets are present."

      # =========================================================
      # 11. Build Release AAB
      # =========================================================
      - name: Build Release AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Building Baatly Release AAB"
          echo "========================================="

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 12. Locate AAB
      # =========================================================
      - name: Locate generated AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated AAB..."

          AAB_PATH="$(find . -type f -name "*.aab" \
            -path "*/build/outputs/bundle/*/*.aab" \
            -print | head -n 1 || true)"

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: Release AAB was not generated."

            echo
            echo "Searching entire project for AAB files:"
            find . -type f -name "*.aab" -print || true

            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_PATH"

          mkdir -p release-artifacts

          cp "$AAB_PATH" "release-artifacts/baatly-release.aab"

          echo
          echo "Final artifact:"
          ls -lh "release-artifacts/baatly-release.aab"

      # =========================================================
      # 13. Upload AAB
      # =========================================================
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ env.GRADLE_PROJECT_DIR }}/release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 14 
