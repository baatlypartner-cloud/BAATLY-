name: Build Baatly Release AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:
      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. JAVA 17
      # IMPORTANT:
      # Do NOT specify cache.
      # setup-java cache accepts only maven/gradle/sbt.
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. VERIFY JAVA
      # =========================================================
      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # =========================================================
      # 4. ANDROID SDK COMMAND LINE TOOLS
      #
      # packages intentionally empty.
      # setup-android will not try to install its default
      # "tools platform-tools" package set.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      # =========================================================
      # 5. FIND SDKMANAGER
      # =========================================================
      - name: Find Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
            do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            echo
            echo "Searching SDK for sdkmanager:"
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # =========================================================
      # 6. INSTALL EXACT SDK PACKAGES REQUIRED BY THIS PROJECT
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # =========================================================
      # 7. VERIFY SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required SDK components..."

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "Android SDK verification PASSED."

          echo
          echo "Platform:"
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-36.1"

          echo
          echo "Build tools:"
          ls -ld "$ANDROID_SDK_ROOT/build-tools/36.0.0"

      # =========================================================
      # 8. VERIFY ACTUAL ZIP PROJECT STRUCTURE
      #
      # ZIP inspection confirmed:
      # ./gradlew
      # ./settings.gradle.kts
      # ./build.gradle.kts
      # ./app/build.gradle.kts
      # =========================================================
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f "./gradlew"
          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x "./gradlew"

          echo "Project structure verified."

      # =========================================================
      # 9. SHOW PROJECT CONFIG
      # =========================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle wrapper:"
          grep "distributionUrl=" gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle:"
          ./gradlew --version

      # =========================================================
      # 10. CHECK SIGNING SECRETS
      #
      # Actual app/build.gradle.kts expects:
      # KEYSTORE_PATH
      # STORE_PASSWORD
      # KEY_PASSWORD
      #
      # keyAlias is fixed to "upload" in the project.
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD GitHub secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD GitHub secret is missing."
            exit 1
          fi

          echo "Signing secrets are present."

      # =========================================================
      # 11. RESTORE RELEASE KEYSTORE
      #
      # The Android project expects KEYSTORE_PATH.
      # =========================================================
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Release keystore restored."

      # =========================================================
      # 12. BUILD RELEASE AAB
      #
      # Actual project uses:
      # ./gradlew clean bundleRelease
      # =========================================================
      - name: Build Release AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Building Baatly Release AAB"
          echo "========================================="

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 13. LOCATE AAB
      # =========================================================
      - name: Locate generated AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Expected AAB not found:"
            echo "$AAB_PATH"

            echo
            echo "Searching for all AAB files:"
            find . -type f -name "*.aab" -print || true

            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB_PATH"

          mkdir -p release-artifacts

          cp "$AAB_PATH" release-artifacts/baatly-release.aab

          echo
          echo "Final release artifact:"
          ls -lh release-artifacts/baatly-release.aab

      # =========================================================
      # 14. UPLOAD AAB
      # =========================================================
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 14 
