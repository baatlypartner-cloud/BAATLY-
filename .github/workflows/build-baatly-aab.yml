name: Build Baatly Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP file not found."
            exit 1
          fi

          echo "Source ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baatly-release.jks"

          if [ ! -s "$RUNNER_TEMP/baatly-release.jks" ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          echo "Release keystore ready."

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Build signed Release AAB
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baatly-release.jks
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Find generated AAB
        id: find_aab
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          AAB_FILE=$(find app/build/outputs/bundle \
            -type f -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Generated AAB: $AAB_FILE"
          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ steps.locate_project.outputs.project_dir }}/${{ steps.find_aab.outputs.aab_file }}
          if-no-files-found: error

      - name: Upload mapping files
        uses: actions/upload-artifact@v4
        with:
          name: baatly-mapping-files
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/mapping/**
          if-no-files-found: ignore
