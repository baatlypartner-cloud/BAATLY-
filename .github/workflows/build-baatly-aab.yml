name: Build Baatly Release AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. Setup Android SDK command line tools
      #
      # IMPORTANT:
      # packages is intentionally empty.
      # This prevents setup-android from trying to install
      # the problematic default "tools platform-tools" package.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      # =========================================================
      # 4. Install required SDK packages
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Searching Android SDK..."
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # =========================================================
      # 5. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."

          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/platform-tools"

          echo "Android SDK verification successful."

      # =========================================================
      # 6. Find Gradle wrapper
      # =========================================================
      - name: Find Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            echo "GRADLE_PROJECT_DIR=." >> "$GITHUB_ENV"
            chmod +x "./gradlew"
            echo "Gradle wrapper found at ./gradlew"
            exit 0
          fi

          GRADLEW_PATH="$(find . -maxdepth 5 -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found."

            echo "Repository root:"
            pwd

            echo
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -n 300

            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW_PATH")"

          echo "GRADLE_PROJECT_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW_PATH"

          echo "Gradle wrapper found:"
          echo "$GRADLEW_PATH"

      # =========================================================
      # 7. Verify Java and Gradle
      # =========================================================
      - name: Verify Java and Gradle
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo
          echo "Gradle version:"
          ./gradlew --version

      # =========================================================
      # 8. Check signing configuration
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required signing secrets are present."

      # =========================================================
      # 9. Build Release AAB
      # =========================================================
      - name: Build Release AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Starting Baatly Release AAB build"
          echo "========================================="

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 10. Locate AAB
      # =========================================================
      - name: Locate generated AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated AAB..."

          AAB_PATH="$(find . -type f -path "*/build/outputs/bundle/*/*.aab" | head -n 1 || true)"

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB file was not generated."

            echo
            echo "Searching all AAB files:"
            find . -type f -name "*.aab" -print || true

            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_PATH"

          mkdir -p release-artifacts

          cp "$AAB_PATH" "release-artifacts/baatly-release.aab"

          echo
          echo "Final artifact:"
          ls -lh "release-artifacts/baatly-release.aab"

      # =========================================================
      # 11. Upload AAB
      # =========================================================
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ env.GRADLE_PROJECT_DIR }}/release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 14
