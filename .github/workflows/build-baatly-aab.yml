name: Build Baatly Release AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # 2. SHOW WHAT IS ACTUALLY IN GITHUB REPOSITORY
      # ==========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Repository root contents:"
          ls -lah

          echo
          echo "ZIP files:"
          find . -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print

      # ==========================================================
      # 3. FIND THE BAATLY ZIP
      #
      # User uploads the Android project as ZIP.
      # We do NOT expect gradlew at repository root.
      # ==========================================================
      - name: Locate Baatly ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | sort
          )

          echo "ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo
          echo "Found ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          # Prefer ZIP whose filename contains "baatly".
          mapfile -t BAATLY_ZIPS < <(
            printf '%s\n' "${ZIP_FILES[@]}" \
              | grep -Ei 'baatly.*\.zip$' \
              || true
          )

          if [ "${#BAATLY_ZIPS[@]}" -eq 1 ]; then
            SELECTED_ZIP="${BAATLY_ZIPS[0]}"
          elif [ "${#BAATLY_ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Baatly ZIP was found."
            echo "Please keep only one Baatly source ZIP in the repository."
            printf '%s\n' "${BAATLY_ZIPS[@]}"
            exit 1
          elif [ "${#ZIP_FILES[@]}" -eq 1 ]; then
            SELECTED_ZIP="${ZIP_FILES[0]}"
          else
            echo "ERROR: Multiple ZIP files found and none clearly identifies Baatly."
            echo "Please keep exactly one Android project ZIP in the repository."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo
          echo "Selected source ZIP:"
          echo "$SELECTED_ZIP"

          echo "SOURCE_ZIP=$SELECTED_ZIP" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. EXTRACT ZIP
      # ==========================================================
      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo
          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f \
            | sort \
            | head -300

      # ==========================================================
      # 5. LOCATE ACTUAL GRADLE PROJECT INSIDE ZIP
      #
      # The inspected ZIP has gradlew at its root.
      # We still locate it instead of assuming a path.
      # ==========================================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$RUNNER_TEMP/baatly-project" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -eq 0 ]; then
            echo "ERROR: gradlew was not found inside the uploaded ZIP."

            echo
            echo "Gradle files found:"
            find "$RUNNER_TEMP/baatly-project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print \
              | sort

            exit 1
          fi

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew but found:"
            printf '%s\n' "${GRADLEW_FILES[@]}"
            exit 1
          fi

          GRADLEW_PATH="${GRADLEW_FILES[0]}"
          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo
          echo "Actual Android project:"
          echo "$PROJECT_DIR"

          # Verify the files known to exist in the inspected ZIP.
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. VERIFY PROJECT CONFIG FROM ZIP
      # ==========================================================
      - name: Verify Baatly project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo
          echo "Gradle wrapper:"
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Android project:"
          grep -nE \
            'namespace|applicationId|targetSdk|versionCode|versionName|minorApiLevel' \
            app/build.gradle.kts \
            || true

      # ==========================================================
      # 7. JAVA 17
      # ==========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 8. VERIFY JAVA
      # ==========================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ==========================================================
      # 9. ANDROID SDK
      #
      # packages is empty intentionally.
      # No deprecated/default extra package installation here.
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      # ==========================================================
      # 10. FIND SDKMANAGER
      # ==========================================================
      - name: Locate sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ==========================================================
      # 11. INSTALL REQUIRED SDK
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # ==========================================================
      # 12. VERIFY SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Android SDK verification PASSED."

      # ==========================================================
      # 13. CHECK REQUIRED GITHUB SECRETS
      # ==========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "All required signing secrets are present."

      # ==========================================================
      # 14. RESTORE KEYSTORE INSIDE EXTRACTED PROJECT
      #
      # Actual app/build.gradle.kts falls back to:
      # ${rootDir}/my-upload-key.jks
      #
      # Therefore place it exactly here.
      # ==========================================================
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$PWD/my-upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "Keystore restored:"
          ls -lh "$KEYSTORE_FILE"

      # ==========================================================
      # 15. VERIFY KEYSTORE / ALIAS
      #
      # Actual ZIP uses alias "upload".
      # ==========================================================
      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore ./my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            > /tmp/keytool-output.txt

          echo "Release keystore and alias 'upload' verified."

      # ==========================================================
      # 16. VERIFY GRADLE
      # ==========================================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      # ==========================================================
      # 17. BUILD SIGNED RELEASE AAB
      # ==========================================================
      - name: Build Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       BAATLY RELEASE AAB BUILD"
          echo "=============================================="

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 18. VERIFY AAB
      # ==========================================================
      - name: Verify generated AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Expected AAB does not exist:"
            echo "$AAB_FILE"

            echo
            echo "All generated AAB files:"
            find . \
              -type f \
              -name "*.aab" \
              -print \
              || true

            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB_FILE"

      # ==========================================================
      # 19. PREPARE ARTIFACT
      # ==========================================================
      - name: Prepare release artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-artifacts
          mkdir -p release-artifacts

          cp \
            app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/baatly-release.aab

          echo "Release artifact:"
          ls -lh release-artifacts/baatly-release.aab

      # ==========================================================
      # 20. UPLOAD AAB
      # ==========================================================
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ env.PROJECT_DIR }}/release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 21. SUCCESS
      # ==========================================================
      - name: Build Success
        shell: bash
        run: |
          echo "=============================================="
          echo "       BAATLY AAB BUILD SUCCESS"
          echo "==============================================" 
