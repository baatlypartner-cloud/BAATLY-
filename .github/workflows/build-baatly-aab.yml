name: Build Baatly Release AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. JAVA 17
      # No cache input.
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. VERIFY JAVA
      # =========================================================
      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # =========================================================
      # 4. ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT pass accept-android-sdk-licenses.
      # Do NOT pass log-accepted-android-sdk-licenses.
      #
      # setup-android accepts SDK licenses by default.
      # packages is empty so it does not install the
      # obsolete/default additional package set.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      # =========================================================
      # 5. FIND SDKMANAGER
      # =========================================================
      - name: Find Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            echo "Available sdkmanager files:"
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # =========================================================
      # 6. INSTALL REQUIRED SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # =========================================================
      # 7. VERIFY SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "Android SDK verification PASSED."

      # =========================================================
      # 8. VERIFY ACTUAL PROJECT STRUCTURE
      # =========================================================
      - name: Verify Baatly project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f "./gradlew"
          test -f "./settings.gradle.kts"
          test -f "./build.gradle.kts"
          test -f "./app/build.gradle.kts"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          chmod +x ./gradlew

          echo "Project structure OK."

      # =========================================================
      # 9. VERIFY GRADLE
      # =========================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle wrapper:"
          grep "distributionUrl=" gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle version:"
          ./gradlew --version

      # =========================================================
      # 10. CHECK SIGNING SECRETS
      #
      # Project expects:
      # KEYSTORE_PATH
      # STORE_PASSWORD
      # KEY_PASSWORD
      #
      # keyAlias is "upload"
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets are present."

      # =========================================================
      # 11. RESTORE KEYSTORE
      # =========================================================
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Release keystore restored."

      # =========================================================
      # 12. BUILD RELEASE AAB
      # =========================================================
      - name: Build Release AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Building Baatly Release AAB"
          echo "========================================="

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 13. VERIFY AAB
      # =========================================================
      - name: Verify generated AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found at:"
            echo "$AAB"

            echo
            echo "Searching for AAB files:"
            find . -type f -name "*.aab" -print || true

            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB"

      # =========================================================
      # 14. COPY ARTIFACT
      # =========================================================
      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          cp \
            app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/baatly-release.aab

          ls -lh release-artifacts/baatly-release.aab

      # =========================================================
      # 15. UPLOAD AAB
      # =========================================================
      - name: Upload Baatly Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 14
