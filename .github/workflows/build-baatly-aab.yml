name: Build Baatly Release AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-baatly-aab.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d source

          echo "Extracted project:"
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baatly-release.jks"

          if [ ! -s "$RUNNER_TEMP/baatly-release.jks" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore created successfully."

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Build signed Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baatly-release.jks
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Find generated AAB
        id: aab
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "AAB generated: $AAB_FILE"
          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.aab.outputs.aab_file }}

      - name: Upload mapping files if available
        uses: actions/upload-artifact@v4
        with:
          name: baatly-mapping
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/mapping/**
          if-no-files-found: ignore
