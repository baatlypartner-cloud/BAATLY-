name: Build Baatly Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:
      # ---------------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Android command-line tools
      # IMPORTANT:
      # packages is intentionally empty.
      # This avoids the failing default "tools platform-tools"
      # installation inside setup-android.
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      # ---------------------------------------------------------
      # 4. Install exact Android SDK packages required by app
      # ---------------------------------------------------------
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 5. Verify SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed SDK platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "Android SDK verification passed."

      # ---------------------------------------------------------
      # 6. Locate Gradle wrapper
      # ---------------------------------------------------------
      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            echo "GRADLE_PROJECT_DIR=." >> "$GITHUB_ENV"
            chmod +x ./gradlew
            echo "Using root project ./gradlew"
            exit 0
          fi

          GRADLEW_PATH="$(find . -maxdepth 4 -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found."
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort | head -n 300
            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW_PATH")"

          echo "GRADLE_PROJECT_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW_PATH"

          echo "Using Gradle wrapper: $GRADLEW_PATH"

      # ---------------------------------------------------------
      # 7. Show Gradle / Java versions
      # ---------------------------------------------------------
      - name: Verify Java and Gradle
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      # ---------------------------------------------------------
      # 8. Build Release AAB
      # ---------------------------------------------------------
      - name: Build Release AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Starting clean release AAB build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 9. Find generated AAB
      # ---------------------------------------------------------
      - name: Locate generated AAB
        working-directory: ${{ env.GRADLE_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for release AAB..."

          AAB_COUNT="$(find . -type f -path "*/build/outputs/bundle/*/*.aab" | wc -l)"

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB generated."
            find . -type f | grep -E '\.aab$' || true
            exit 1
          fi

          echo
          echo "Generated AAB files:"
          find . -type f -path "*/build/outputs/bundle/*/*.aab" -print

          mkdir -p release-artifacts

          AAB_PATH="$(find . -type f -path "*/build/outputs/bundle/*/*.aab" | head -n 1)"

          cp "$AAB_PATH" "release-artifacts/baatly-release.aab"

          echo
          echo "Copied AAB to:"
          ls -lh release-artifacts/baatly-release.aab

      # ---------------------------------------------------------
      # 10. Upload AAB artifact
      # ---------------------------------------------------------
      - name: Upload Baatly AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-aab
          path: ${{ env.GRADLE_PROJECT_DIR }}/release-artifacts/baatly-release.aab
          if-no-files-found: error
          retention-days: 14
