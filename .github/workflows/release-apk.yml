name: Baatly Release APK

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '*.ZIP'
      - '**/*.ZIP'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baatly-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and extract Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r candidate; do
            if [[ -f "$candidate" ]]; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -Ei '\.zip$' || true
          )

          if [[ -z "$ZIP_FILE" ]]; then
            while IFS= read -r candidate; do
              if [[ -f "$candidate" ]]; then
                ZIP_FILE="$candidate"
                break
              fi
            done < <(
              git log --pretty=format: --name-only -- '*.zip' '*.ZIP' |
                grep -Ei '\.zip$' |
                awk '!seen[$0]++' || true
            )
          fi

          if [[ -z "$ZIP_FILE" || ! -f "$ZIP_FILE" ]]; then
            echo "::error::No Android ZIP found in repository."
            exit 1
          fi

          echo "Building ZIP: $ZIP_FILE"

          UNPACK_DIR="$RUNNER_TEMP/baatly-unpacked"
          rm -rf "$UNPACK_DIR"
          mkdir -p "$UNPACK_DIR"
          unzip -q "$ZIP_FILE" -d "$UNPACK_DIR"

          if [[ -f "$UNPACK_DIR/gradlew" ]]; then
            PROJECT_DIR="$UNPACK_DIR"
          else
            WRAPPER_PATH="$(find "$UNPACK_DIR" -type f -name gradlew -print -quit)"

            if [[ -z "$WRAPPER_PATH" ]]; then
              echo "::error::Gradle wrapper not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$WRAPPER_PATH")"
          fi

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ||
                ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::Expected Android project files are missing."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Fix the deprecated OkHttp API in the uploaded ZIP.
      - name: Fix OkHttp URL calls
        shell: bash
        run: |
          set -euo pipefail

          CLIENT_FILE="$PROJECT_DIR/app/src/main/java/com/example/data/network/SupabaseClient.kt"

          if [[ ! -f "$CLIENT_FILE" ]]; then
            echo "::error::SupabaseClient.kt not found in the ZIP."
            exit 1
          fi

          python3 - "$CLIENT_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "okhttp3.HttpUrl.get(rawUrl)"
          new = "rawUrl.toHttpUrl()"
          count = source.count(old)

          path.write_text(source.replace(old, new), encoding="utf-8")
          print(f"Replaced {count} deprecated OkHttp call(s).")
          PY

      - name: Configure AWS app secrets
        shell: bash
        env:
          AWS_API_BASE_URL: ${{ secrets.AWS_API_BASE_URL }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          : "${AWS_API_BASE_URL:?Missing AWS_API_BASE_URL GitHub Secret}"
          : "${AGORA_APP_ID:?Missing AGORA_APP_ID GitHub Secret}"

          case "$AWS_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::AWS_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac

          printf 'AWS_API_BASE_URL=%s\nAGORA_APP_ID=%s\n' \
            "$AWS_API_BASE_URL" "$AGORA_APP_ID" \
            > "$PROJECT_DIR/.env"

          echo "AWS app environment configured."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_B64:?Missing Base64 release keystore Secret}"
          : "${STORE_PASSWORD:?Missing keystore password Secret}"
          : "${KEY_PASSWORD:?Missing key password Secret}"

          KEYSTORE_FILE="$PROJECT_DIR/my-upload-key.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias upload >/dev/null

          echo "Release signing keystore validated."

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose "$APK_PATH"

          echo "Release APK generated and signature verified."

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
 
