name: Baatly Release APK

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: read

concurrency:
  group: baatly-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Get the uploaded ZIP from GitHub
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Step 2: Install Java required by this Android project
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Configure Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Step 4: Automatically find and extract the ZIP
      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(git show --format= --name-only "$GITHUB_SHA" | grep -Ei '\.zip$' | head -n 1 || true)"

          if [[ -z "$ZIP_FILE" || ! -f "$ZIP_FILE" ]]; then
            echo "::error::The newly uploaded ZIP file could not be found."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"

          UNPACK_DIR="$RUNNER_TEMP/baatly-unpacked"

          rm -rf "$UNPACK_DIR"
          mkdir -p "$UNPACK_DIR"

          unzip -q "$ZIP_FILE" -d "$UNPACK_DIR"

          if [[ -f "$UNPACK_DIR/gradlew" ]]; then
            PROJECT_DIR="$UNPACK_DIR"
          else
            WRAPPER_PATH="$(find "$UNPACK_DIR" -type f -name gradlew -print -quit)"

            if [[ -z "$WRAPPER_PATH" ]]; then
              echo "::error::Gradle wrapper was not found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$WRAPPER_PATH")"
          fi

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "::error::Android project settings.gradle.kts is missing."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::Android app module was not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project extracted successfully."

      # Step 5: Generate the app environment file from GitHub Secrets
      - name: Configure app secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Missing SUPABASE_URL GitHub Secret}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing Supabase publishable key Secret}"
          : "${AGORA_APP_ID:?Missing AGORA_APP_ID GitHub Secret}"

          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nAGORA_APP_ID=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_PUBLISHABLE_KEY" \
            "$AGORA_APP_ID" \
            > "$PROJECT_DIR/.env"

          echo "App environment configured."

      # Step 6: Decode the existing release signing keystore
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_B64:?Missing Base64 release keystore Secret}"
          : "${STORE_PASSWORD:?Missing keystore password Secret}"
          : "${KEY_PASSWORD:?Missing key password Secret}"

          KEYSTORE_FILE="$PROJECT_DIR/my-upload-key.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Release signing keystore validated."

      # Step 7: Install the required Android SDK platform and build tools
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      # Step 8: Build the signed release APK
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      # Step 9: Verify the generated APK
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose "$APK_PATH"

          echo "Release APK generated and signature verified."

      # Step 10: Upload the APK as a downloadable artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
