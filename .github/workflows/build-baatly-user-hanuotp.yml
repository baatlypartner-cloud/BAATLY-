name: Build BAATLY User App (HanuOTP)

on:
  push:
    paths:
      - 'baatly-user-hanuotp-otp-v29.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed User APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/baatly-user-hanuotp-otp-v29.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: Source ZIP not found in repository root."
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "Source ZIP validation passed."

      - name: Extract source ZIP on runner
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "$GITHUB_WORKSPACE/baatly-user-hanuotp-otp-v29.zip" \
            -d "$EXTRACT_DIR"

          test -f "$EXTRACT_DIR/gradlew"
          test -f "$EXTRACT_DIR/settings.gradle.kts"
          test -f "$EXTRACT_DIR/app/build.gradle.kts"
          test -f "$EXTRACT_DIR/app/google-services.json"

          chmod +x "$EXTRACT_DIR/gradlew"

          echo "Source ZIP extracted and validated."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36.1' \
            'build-tools;36.0.0'

      - name: Validate GitHub Secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            AGORA_APP_ID \
            KEYSTORE_BASE64 \
            STORE_PASSWORD \
            KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: GitHub Secret '$name' is missing."
              exit 1
            fi
          done

          echo "All required build secrets are present."

      - name: Create app environment file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/baatly-project"

          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'AGORA_APP_ID=%s\n' "$AGORA_APP_ID"
          } > .env

          chmod 600 .env

          echo "App environment configured."

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/baatly-upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "ERROR: Release keystore preparation failed."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release signing key prepared."

      - name: Build release APK and AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/baatly-project"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease \
            bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/baatly-project/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Release APK was not produced."
            find "$RUNNER_TEMP/baatly-project/app/build/outputs" \
              -maxdepth 5 -type f -print || true
            exit 1
          fi

          apksigner verify --verbose --print-certs "$APK"

          echo "APK signature verification passed."

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-hanuotp-v29-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/baatly-project/app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/baatly-project/app/build/outputs/bundle/release/*.aab
          retention-days: 14
