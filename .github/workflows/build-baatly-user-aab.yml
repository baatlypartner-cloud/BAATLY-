name: Build Baatly User App AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly User Release AAB
    runs-on: ubuntu-latest

    env:
      SOURCE_ZIP: "baatly - 2026-09-19T141237.053.zip"
      PROJECT_DIR: "baatly-source"

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Setup JDK 17
      # ==========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. Check source ZIP
      # ==========================================================
      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -lah

          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo
            echo "ERROR: Source ZIP not found."
            echo "Expected file:"
            echo "$SOURCE_ZIP"
            echo
            echo "ZIP files currently present:"
            find . -maxdepth 2 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo
          echo "Source ZIP found:"
          ls -lh "$SOURCE_ZIP"

      # ==========================================================
      # 4. Extract source ZIP
      # ==========================================================
      - name: Extract Baatly source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"

          echo "ZIP extracted."

          echo
          echo "Project root:"
          ls -lah "$PROJECT_DIR"

      # ==========================================================
      # 5. Verify exact Android project structure
      # ==========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -d "$PROJECT_DIR/app"

          echo "Android project structure verified successfully."

      # ==========================================================
      # 6. Make Gradle executable
      # ==========================================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper ready."

      # ==========================================================
      # 7. Create .env from GitHub Secrets
      # ==========================================================
      - name: Create production .env
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "ERROR: GitHub Secret SUPABASE_URL is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "ERROR: GitHub Secret SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi

          if [[ -z "${AGORA_APP_ID:-}" ]]; then
            echo "ERROR: GitHub Secret AGORA_APP_ID is missing."
            exit 1
          fi

          cat > "$PROJECT_DIR/.env" <<EOF
SUPABASE_URL=$SUPABASE_URL
SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
AGORA_APP_ID=$AGORA_APP_ID
EOF

          chmod 600 "$PROJECT_DIR/.env"

          echo ".env created successfully from GitHub Actions secrets."

      # ==========================================================
      # 8. Create release keystore
      # ==========================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: GitHub Secret KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            "$PROJECT_DIR/my-upload-key.jks"

          if [[ ! -s "$PROJECT_DIR/my-upload-key.jks" ]]; then
            echo "ERROR: Keystore file was not created correctly."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      # ==========================================================
      # 9. Verify Java / Gradle
      # ==========================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          cd "$PROJECT_DIR"
          ./gradlew --version

      # ==========================================================
      # 10. Verify required Gradle environment
      # ==========================================================
      - name: Verify release signing configuration
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            echo "ERROR: KEYSTORE_PATH does not point to a valid keystore."
            exit 1
          fi

          if [[ -z "${STORE_PASSWORD:-}" ]]; then
            echo "ERROR: GitHub Secret STORE_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: GitHub Secret KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Release signing inputs are present."

      # ==========================================================
      # 11. Build signed release AAB
      # ==========================================================
      - name: Build signed release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Running clean release build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 12. Verify generated AAB
      # ==========================================================
      - name: Verify generated AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$AAB_FILE" ]]; then
            echo "ERROR: Expected release AAB was not generated."
            echo
            echo "Available bundle outputs:"
            find "$PROJECT_DIR/app/build/outputs/bundle" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Release AAB generated successfully:"
          ls -lh "$AAB_FILE"

      # ==========================================================
      # 13. Copy final AAB with proper name
      # ==========================================================
      - name: Prepare final AAB
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            "$GITHUB_WORKSPACE/baatly-user-release.aab"

          echo "Final AAB:"
          ls -lh "$GITHUB_WORKSPACE/baatly-user-release.aab"

      # ==========================================================
      # 14. Upload AAB to GitHub Actions
      # ==========================================================
      - name: Upload Baatly User AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-release-aab
          path: baatly-user-release.aab
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 15. Cleanup sensitive files
      # ==========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/my-upload-key.jks" || true
          rm -f "$PROJECT_DIR/.env" || true

          echo "Sensitive build files cleaned up."
