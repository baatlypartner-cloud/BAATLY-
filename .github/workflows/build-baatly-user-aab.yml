name: Baatly User App AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build User Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check ZIP
        run: |
          set -e

          ZIP="baatly - 2026-09-19T141237.053.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found: $ZIP"
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP"

      - name: Extract project
        run: |
          set -e

          rm -rf baatly-source
          mkdir baatly-source

          unzip -q "baatly - 2026-09-19T141237.053.zip" -d baatly-source

          echo "Project extracted."
          ls -la baatly-source

      - name: Verify project
        run: |
          set -e

          test -f baatly-source/gradlew
          test -f baatly-source/settings.gradle.kts
          test -f baatly-source/app/build.gradle.kts

          chmod +x baatly-source/gradlew

          echo "Android project verified."

      - name: Create environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          if [ -z "$AGORA_APP_ID" ]; then
            echo "ERROR: AGORA_APP_ID secret is missing."
            exit 1
          fi

          printf '%s\n' \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            "AGORA_APP_ID=$AGORA_APP_ID" \
            > baatly-source/.env

          chmod 600 baatly-source/.env

          echo ".env created."

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > baatly-source/my-upload-key.jks

          test -s baatly-source/my-upload-key.jks

          echo "Keystore prepared."

      - name: Verify Gradle
        run: |
          set -e

          cd baatly-source

          java -version
          ./gradlew --version

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          cd baatly-source

          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Check AAB
        run: |
          set -e

          AAB="baatly-source/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          cp "$AAB" baatly-user-release.aab

          echo "AAB generated:"
          ls -lh baatly-user-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-release-aab
          path: baatly-user-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f baatly-source/my-upload-key.jks
          rm -f baatly-source/.env 
