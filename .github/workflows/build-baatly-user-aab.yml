name: Build Baatly User App AAB

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Baatly User Release AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SOURCE_ZIP: "baatly - 2026-09-19T141237.053.zip"
      BUILD_DIR: "baatly-user-source"

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------
      # 3. Check source ZIP
      # ---------------------------------------------------------
      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source ZIP..."

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP was not found."
            echo
            echo "Expected:"
            echo "$SOURCE_ZIP"
            echo
            echo "Repository files:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo
          echo "Source ZIP found:"
          ls -lh "$SOURCE_ZIP"

      # ---------------------------------------------------------
      # 4. Extract ZIP
      # ---------------------------------------------------------
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "Extracting source ZIP..."

          unzip -q "$SOURCE_ZIP" -d "$BUILD_DIR"

          echo
          echo "Extraction completed."

          find "$BUILD_DIR" -maxdepth 2 -type f -print | sort | head -200

      # ---------------------------------------------------------
      # 5. Detect actual Gradle project root
      # ---------------------------------------------------------
      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "$BUILD_DIR/gradlew" ]; then
            PROJECT_ROOT="$BUILD_DIR"
          else
            FOUND_GRADLEW="$(find "$BUILD_DIR" -type f -name "gradlew" -print -quit)"

            if [ -n "$FOUND_GRADLEW" ]; then
              PROJECT_ROOT="$(dirname "$FOUND_GRADLEW")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: gradlew was not found."
            echo
            echo "Extracted project:"
            find "$BUILD_DIR" -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

          echo "$PROJECT_ROOT" > project_root.txt

          echo
          echo "Project root contents:"
          ls -la "$PROJECT_ROOT"

      # ---------------------------------------------------------
      # 6. Make Gradle executable
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          chmod +x "$PROJECT_ROOT/gradlew"

          echo "Gradle wrapper is executable."

      # ---------------------------------------------------------
      # 7. Verify Java
      # ---------------------------------------------------------
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

      # ---------------------------------------------------------
      # 8. Verify Gradle
      # ---------------------------------------------------------
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          cd "$PROJECT_ROOT"

          ./gradlew --version

      # ---------------------------------------------------------
      # 9. Validate Android project
      # ---------------------------------------------------------
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android project validation successful."

      # ---------------------------------------------------------
      # 10. Prepare environment
      # ---------------------------------------------------------
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [ -f "$PROJECT_ROOT/.env.example" ]; then
            cp "$PROJECT_ROOT/.env.example" "$PROJECT_ROOT/.env"
            echo ".env created."
          else
            echo "No .env.example found. Continuing."
          fi

      # ---------------------------------------------------------
      # 11. Prepare release keystore
      # ---------------------------------------------------------
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BAATLY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: BAATLY_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            "$PROJECT_ROOT/my-upload-key.jks"

          if [ ! -s "$PROJECT_ROOT/my-upload-key.jks" ]; then
            echo "ERROR: Keystore was not created correctly."
            exit 1
          fi

          echo "Release keystore prepared."

      # ---------------------------------------------------------
      # 12. Build release AAB
      # ---------------------------------------------------------
      - name: Build release AAB
        shell: bash
        env:
          BAATLY_STORE_PASSWORD: ${{ secrets.BAATLY_STORE_PASSWORD }}
          BAATLY_KEY_PASSWORD: ${{ secrets.BAATLY_KEY_PASSWORD }}
          BAATLY_KEYSTORE_PATH: ${{ github.workspace }}/baatly-user-source/my-upload-key.jks
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [ -z "${BAATLY_STORE_PASSWORD:-}" ]; then
            echo "ERROR: BAATLY_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${BAATLY_KEY_PASSWORD:-}" ]; then
            echo "ERROR: BAATLY_KEY_PASSWORD secret is missing."
            exit 1
          fi

          cd "$PROJECT_ROOT"

          echo "Starting clean release AAB build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 13. Find AAB
      # ---------------------------------------------------------
      - name: Find generated AAB
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          AAB="$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/bundle/*/*.aab" \
            -print -quit)"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."

            echo
            echo "Available build files:"
            find "$PROJECT_ROOT" \
              -path "*/build/*" \
              -type f \
              -print | sort || true

            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          echo "$AAB" > aab_path.txt

      # ---------------------------------------------------------
      # 14. Verify AAB
      # ---------------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(cat aab_path.txt)"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB file does not exist."
            exit 1
          fi

          echo "Generated AAB:"
          ls -lh "$AAB"

          echo
          echo "AAB verification:"

          jarsigner -verify -verbose -certs "$AAB" || true

      # ---------------------------------------------------------
      # 15. Rename final AAB
      # ---------------------------------------------------------
      - name: Prepare final AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(cat aab_path.txt)"

          cp "$AAB" "$GITHUB_WORKSPACE/baatly-user-release.aab"

          echo "Final file:"
          ls -lh "$GITHUB_WORKSPACE/baatly-user-release.aab"

      # ---------------------------------------------------------
      # 16. Upload artifact
      # ---------------------------------------------------------
      - name: Upload Baatly User AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-release-aab
          path: baatly-user-release.aab
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 17. Cleanup signing key
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          PROJECT_ROOT="$(cat project_root.txt 2>/dev/null || true)"

          if [ -n "$PROJECT_ROOT" ] && \
             [ -f "$PROJECT_ROOT/my-upload-key.jks" ]; then
            rm -f "$PROJECT_ROOT/my-upload-key.jks"
          fi

          echo "Cleanup completed." 
