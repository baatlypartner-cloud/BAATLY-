name: Baatly User App AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly User Release AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Check source ZIP
      # --------------------------------------------------
      - name: Find Baatly source ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP_FILE="baatly - 2026-09-19T141237.053.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Baatly source ZIP not found."
            echo "Expected:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo ""
          echo "Source ZIP found:"
          ls -lh "$ZIP_FILE"

      # --------------------------------------------------
      # 4. Extract source ZIP
      # --------------------------------------------------
      - name: Extract Baatly project
        shell: bash
        run: |
          set -e

          rm -rf baatly-source
          mkdir -p baatly-source

          unzip -q \
            "baatly - 2026-09-19T141237.053.zip" \
            -d baatly-source

          echo "Extracted project:"
          ls -lah baatly-source

      # --------------------------------------------------
      # 5. Verify project structure
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "baatly-source/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "baatly-source/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "baatly-source/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android project structure verified."

      # --------------------------------------------------
      # 6. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          chmod +x baatly-source/gradlew

          echo "Gradle wrapper:"
          ls -lh baatly-source/gradlew

      # --------------------------------------------------
      # 7. Prepare .env
      # --------------------------------------------------
      - name: Prepare environment
        shell: bash
        run: |
          set -e

          cd baatly-source

          if [ -f ".env.example" ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo "No .env.example found."
          fi

      # --------------------------------------------------
      # 8. Decode release keystore
      # --------------------------------------------------
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BAATLY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing GitHub secret:"
            echo "BAATLY_UPLOAD_KEYSTORE_BASE64"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            baatly-source/my-upload-key.jks

          if [ ! -s "baatly-source/my-upload-key.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      # --------------------------------------------------
      # 9. Verify Java and Gradle
      # --------------------------------------------------
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"

          cd baatly-source
          ./gradlew --version

      # --------------------------------------------------
      # 10. Build signed release AAB
      # --------------------------------------------------
      - name: Build signed release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.BAATLY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BAATLY_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: Missing GitHub secret:"
            echo "BAATLY_STORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing GitHub secret:"
            echo "BAATLY_KEY_PASSWORD"
            exit 1
          fi

          cd baatly-source

          echo "Starting release AAB build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 11. Locate generated AAB
      # --------------------------------------------------
      - name: Locate AAB
        shell: bash
        run: |
          set -e

          echo "Searching for AAB..."

          AAB_FILE=$(find \
            baatly-source/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No AAB file generated."

            echo ""
            echo "Build output:"
            find baatly-source/app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" baatly-user-release.aab

          echo ""
          echo "Final AAB:"
          ls -lh baatly-user-release.aab

      # --------------------------------------------------
      # 12. Upload AAB artifact
      # --------------------------------------------------
      - name: Upload Baatly User AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-release-aab
          path: baatly-user-release.aab
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 13. Remove keystore
      # --------------------------------------------------
      - name: Cleanup keystore
        if: always()
        shell: bash
        run: |
          rm -f baatly-source/my-upload-key.jks || true 
