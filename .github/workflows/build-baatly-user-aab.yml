name: Baatly User App AAB

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build User Release AAB
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout full repository history
      #    Full history is required to identify the latest ZIP.
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # =====================================================
      # 2. Setup Java 17
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =====================================================
      # 3. Automatically find the latest updated ZIP
      # =====================================================
      - name: Find latest source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository root for ZIP files..."

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip" -print
          )

          if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
            echo ""
            echo "ERROR: No ZIP file was found in repository root."
            echo ""
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo ""
          echo "ZIP files found:"
          printf '%s\n' "${ZIP_FILES[@]}"

          LATEST_ZIP=""
          LATEST_COMMIT_TIME=0

          for ZIP in "${ZIP_FILES[@]}"; do
            COMMIT_TIME="$(git log -1 --format=%ct -- "$ZIP" 2>/dev/null || echo 0)"

            if [[ -z "$COMMIT_TIME" ]]; then
              COMMIT_TIME=0
            fi

            echo "ZIP: $ZIP"
            echo "Last Git update: $COMMIT_TIME"

            if (( COMMIT_TIME > LATEST_COMMIT_TIME )); then
              LATEST_COMMIT_TIME="$COMMIT_TIME"
              LATEST_ZIP="$ZIP"
            fi
          done

          # Fallback when Git history does not contain the ZIP.
          if [[ -z "$LATEST_ZIP" ]]; then
            LATEST_ZIP="${ZIP_FILES[0]}"
          fi

          echo ""
          echo "Selected source ZIP:"
          echo "$LATEST_ZIP"

          echo "$LATEST_ZIP" > source_zip.txt

      # =====================================================
      # 4. Extract selected ZIP
      # =====================================================
      - name: Extract Baatly project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(cat source_zip.txt)"

          rm -rf baatly-source
          mkdir -p baatly-source

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d baatly-source

          echo ""
          echo "Extraction completed."

      # =====================================================
      # 5. Detect Gradle project automatically
      # =====================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW_PATH="$(
            find baatly-source \
              -type f \
              -name "gradlew" \
              -print -quit
          )"

          if [[ -z "$GRADLEW_PATH" ]]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            find baatly-source -maxdepth 4 -type f -print | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$GRADLEW_PATH")"

          echo "Detected Gradle project root:"
          echo "$PROJECT_ROOT"

          if [[ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]] && \
             [[ ! -f "$PROJECT_ROOT/settings.gradle" ]]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [[ ! -d "$PROJECT_ROOT/app" ]]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]] && \
             [[ ! -f "$PROJECT_ROOT/app/build.gradle" ]]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo "$PROJECT_ROOT" > project_root.txt

          chmod +x "$PROJECT_ROOT/gradlew"

          echo ""
          echo "Android project verified successfully."

      # =====================================================
      # 6. Create .env from GitHub Secrets
      # =====================================================
      - name: Create production environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          if [[ -z "${AGORA_APP_ID:-}" ]]; then
            echo "ERROR: AGORA_APP_ID secret is missing."
            exit 1
          fi

          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'AGORA_APP_ID=%s\n' "$AGORA_APP_ID"
          } > "$PROJECT_ROOT/.env"

          chmod 600 "$PROJECT_ROOT/.env"

          echo ".env created successfully."

      # =====================================================
      # 7. Prepare release keystore
      # =====================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > \
            "$PROJECT_ROOT/my-upload-key.jks"

          if [[ ! -s "$PROJECT_ROOT/my-upload-key.jks" ]]; then
            echo "ERROR: Keystore could not be created."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      # =====================================================
      # 8. Verify signing configuration
      # =====================================================
      - name: Verify signing configuration
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! -f "$KEYSTORE_PATH" ]]; then
            echo "ERROR: Signing keystore not found."
            exit 1
          fi

          if [[ -z "${STORE_PASSWORD:-}" ]]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing configuration is ready."

      # =====================================================
      # 9. Verify Java and Gradle
      # =====================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          cd "$PROJECT_ROOT"
          ./gradlew --version

      # =====================================================
      # 10. Build signed release AAB
      # =====================================================
      - name: Build User Release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/baatly-source/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          cd "$PROJECT_ROOT"

          echo "Starting clean release build..."

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      # =====================================================
      # 11. Find generated AAB automatically
      # =====================================================
      - name: Find generated AAB
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(cat project_root.txt)"

          AAB_FILE="$(
            find "$PROJECT_ROOT/app/build/outputs/bundle" \
              -type f \
              -name "*.aab" \
              -print -quit
          )"

          if [[ -z "$AAB_FILE" ]]; then
            echo "ERROR: No AAB file was generated."
            echo ""
            echo "Available output files:"
            find "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Generated AAB:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" "$GITHUB_WORKSPACE/baatly-user-release.aab"

      # =====================================================
      # 12. Verify final AAB
      # =====================================================
      - name: Verify final AAB
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "baatly-user-release.aab" ]]; then
            echo "ERROR: Final AAB not found."
            exit 1
          fi

          echo "Final User AAB:"
          ls -lh "baatly-user-release.aab"

      # =====================================================
      # 13. Upload AAB artifact
      # =====================================================
      - name: Upload User AAB
        uses: actions/upload-artifact@v4
        with:
          name: baatly-user-release-aab
          path: baatly-user-release.aab
          if-no-files-found: error
          retention-days: 30

      # =====================================================
      # 14. Cleanup sensitive files
      # =====================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          PROJECT_ROOT="$(cat project_root.txt 2>/dev/null || true)"

          if [[ -n "$PROJECT_ROOT" ]]; then
            rm -f "$PROJECT_ROOT/my-upload-key.jks" || true
            rm -f "$PROJECT_ROOT/.env" || true
          fi

          echo "Cleanup completed." 
