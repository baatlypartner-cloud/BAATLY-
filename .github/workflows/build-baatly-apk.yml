name: Build Baatly Release APK

on:
  workflow_dispatch:

  push:


permissions:
  contents: read


jobs:
  build:

    name: Build Baatly Release APK

    runs-on: ubuntu-latest


    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8


    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 3. LOCATE ANDROID SDK
      # =========================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Searching for sdkmanager..."

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null \
              | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            echo
            echo "Android SDK contents:"
            find "$ANDROID_SDK_ROOT" \
              -maxdepth 4 \
              -type f \
              2>/dev/null \
              | head -200
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version


      # =========================================================
      # 4. ANDROID SDK LICENSES
      # =========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # =========================================================
      # 5. INSTALL REQUIRED ANDROID SDK
      # =========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          echo
          echo "Android SDK installation completed."


      # =========================================================
      # 6. VERIFY ANDROID SDK
      # =========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."

          test -d "$ANDROID_SDK_ROOT/platform-tools"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"

          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo
          echo "Android SDK verification PASSED."

          echo
          echo "Installed platform:"
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-36.1"

          echo
          echo "Installed build tools:"
          ls -ld "$ANDROID_SDK_ROOT/build-tools/36.0.0"


      # =========================================================
      # 7. FIND BAATLY ZIP
      # =========================================================

      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | grep -Ei '/[^/]*baatly[^/]*\.zip$' \
              | grep -Eiv 'partner' \
              | sort
          )

          echo "Baatly ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No Baatly ZIP found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one Baatly ZIP found."

            printf '%s\n' "${ZIP_FILES[@]}"

            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[0]}"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo
          echo "Selected Baatly ZIP:"
          echo "$SOURCE_ZIP"


      # =========================================================
      # 8. VERIFY ZIP
      # =========================================================

      - name: Verify Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -t "$SOURCE_ZIP"

          echo
          echo "ZIP integrity PASSED."


      # =========================================================
      # 9. EXTRACT ZIP
      # =========================================================

      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo
          echo "ZIP extracted successfully."


      # =========================================================
      # 10. FIND GRADLE PROJECT
      # =========================================================

      - name: Locate Baatly Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          echo "gradlew files found: ${#GRADLEW_FILES[@]}"

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then

            echo "ERROR: Expected exactly one gradlew."

            printf '%s\n' "${GRADLEW_FILES[@]}"

            exit 1

          fi

          PROJECT_DIR="$(dirname "${GRADLEW_FILES[0]}")"

          test -f "$PROJECT_DIR/gradlew"

          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Baatly Gradle project:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 11. PREPARE BUILD
      # =========================================================

      - name: Prepare Baatly build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APP_FILE="app/build.gradle.kts"

          ROOT_FILE="build.gradle.kts"

          echo "Preparing Baatly build configuration..."


          # -----------------------------------------------------
          # Java 11 -> Java 17
          # -----------------------------------------------------

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP_FILE"


          # -----------------------------------------------------
          # Remove KSP plugin if present
          # -----------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp)/d' \
            "$APP_FILE"


          sed -i \
            '/alias(libs.plugins.ksp)/d' \
            "$APP_FILE"


          # -----------------------------------------------------
          # Remove KSP from root build file
          # -----------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp) apply false/d' \
            "$ROOT_FILE"


          sed -i \
            '/alias(libs.plugins.ksp) apply false/d' \
            "$ROOT_FILE"


          # -----------------------------------------------------
          # Remove Moshi KSP processor
          # -----------------------------------------------------

          sed -i \
            '/moshi.kotlin.codegen/d' \
            "$APP_FILE"


          # -----------------------------------------------------
          # Add Kotlin JVM 17 compiler target
          # -----------------------------------------------------

          if ! grep -q "jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)" "$APP_FILE"; then

            cat >> "$APP_FILE" <<'EOF'

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
EOF

          fi


          echo
          echo "Build configuration prepared."


      # =========================================================
      # 12. VERIFY JAVA + GRADLE
      # =========================================================

      - name: Verify Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================="
          echo "JAVA"
          echo "=============================="

          java -version

          echo
          echo "=============================="
          echo "GRADLE"
          echo "=============================="

          ./gradlew --version


      # =========================================================
      # 13. CHECK SIGNING SECRETS
      # =========================================================

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets are present."


      # =========================================================
      # 14. RESTORE KEYSTORE
      # =========================================================

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

          echo "Release keystore restored."


      # =========================================================
      # 15. VERIFY KEYSTORE
      # =========================================================

      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Release keystore verified."


      # =========================================================
      # 16. CLEAN
      # =========================================================

      - name: Clean Baatly project
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 17. BUILD RELEASE APK
      # =========================================================

      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "       BAATLY RELEASE APK BUILD"
          echo "=============================================="
          echo

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # 18. VERIFY APK
      # =========================================================

      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then

            echo "ERROR: app-release.apk was not generated."

            echo
            echo "Searching for APK files..."

            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1

          fi

          echo
          echo "APK generated successfully:"
          ls -lh "$APK_FILE"


      # =========================================================
      # 19. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK_FILE"

          echo
          echo "APK signature verification PASSED."


      # =========================================================
      # 20. UPLOAD APK
      # =========================================================

      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4

        with:
          name: baatly-release-apk

          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 30


      # =========================================================
      # 21. SUCCESS
      # =========================================================

      - name: Build Success
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "       BAATLY APK BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Artifact: baatly-release-apk" 
