name: Build Baatly Release APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # ============================================================
      # 1. CHECKOUT GITHUB REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      #
      # IMPORTANT:
      # No "yes | sdkmanager" here.
      # This avoids the Broken pipe error from previous run.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0


      # ============================================================
      # 4. FIND THE SINGLE ZIP
      # ============================================================
      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print | sort
          )

          echo "ZIP files found:"
          printf '%s\n' "${ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Exactly ONE ZIP file is required."
            echo "Found ${#ZIP_FILES[@]} ZIP file(s)."
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[0]}"

          echo ""
          echo "Using Baatly ZIP:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VERIFY ZIP
      # ============================================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."
          unzip -t "$SOURCE_ZIP"

          echo ""
          echo "ZIP is valid."


      # ============================================================
      # 6. EXTRACT ZIP
      # ============================================================
      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting Baatly ZIP..."

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo ""
          echo "Extraction completed."

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 7. LOCATE ACTUAL GRADLE PROJECT INSIDE ZIP
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for gradlew..."

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Expected exactly ONE gradlew."
            echo "Found:"
            printf '%s\n' "${GRADLEW_FILES[@]}"
            exit 1
          fi

          GRADLEW="${GRADLEW_FILES[0]}"

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo ""
          echo "Baatly project:"
          echo "$PROJECT_DIR"

          # Required project files
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "Gradle project verified."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Checking Android 36.1 platform..."

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36.1" ]; then
            echo "ERROR: Android SDK Platform 36.1 not found."
            exit 1
          fi

          echo "Checking build-tools 36.0.0..."

          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" ]; then
            echo "ERROR: Android Build Tools 36.0.0 not found."
            exit 1
          fi

          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo ""
          echo "Android SDK verified successfully."


      # ============================================================
      # 9. CHECK SIGNING SECRETS
      # ============================================================
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are present."


      # ============================================================
      # 10. RESTORE RELEASE KEYSTORE
      # ============================================================
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Restoring release keystore..."

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore restored."

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY KEYSTORE
      # ============================================================
      - name: Verify keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload >/dev/null

          echo "Keystore verified successfully."


      # ============================================================
      # 12. FIX CONFIRMED GiftBottomSheet.kt ERROR
      #
      # Actual ZIP has:
      #
      # GiftItem.priceRupees
      #
      # But GiftBottomSheet.kt had:
      #
      # gift.coinPrice
      #
      # at line 99 and line 159.
      #
      # We change ONLY those confirmed references.
      # ============================================================
      - name: Fix confirmed GiftBottomSheet compile errors
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/example/ui/gift/GiftBottomSheet.kt"

          echo "Checking source file:"
          echo "$FILE"

          if [ ! -f "$FILE" ]; then
            echo ""
            echo "ERROR: GiftBottomSheet.kt not found."
            echo ""
            find app/src -type f -name "GiftBottomSheet.kt" -print
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          # Confirmed line from the actual ZIP
          old1 = (
              "val giftPrice = if (gift.priceRupees > 0.0) "
              "gift.priceRupees else gift.coinPrice.toDouble()"
          )

          new1 = (
              "val giftPrice = gift.priceRupees"
          )

          # Confirmed second line from the actual ZIP
          old2 = (
              "val selectedPrice = selectedGift?.let { "
              "if (it.priceRupees > 0.0) gift.priceRupees "
              "else it.coinPrice.toDouble() } ?: 0.0"
          )

          # Actual source uses it.priceRupees, so use the exact real line too.
          old2_real = (
              "val selectedPrice = selectedGift?.let { "
              "if (it.priceRupees > 0.0) it.priceRupees "
              "else it.coinPrice.toDouble() } ?: 0.0"
          )

          new2 = (
              "val selectedPrice = selectedGift?.priceRupees ?: 0.0"
          )

          if old1 not in text:
              raise SystemExit(
                  "ERROR: Expected giftPrice coinPrice line was not found."
              )

          if old2_real in text:
              text = text.replace(old2_real, new2)
          elif old2 in text:
              text = text.replace(old2, new2)
          else:
              raise SystemExit(
                  "ERROR: Expected selectedPrice coinPrice line was not found."
              )

          text = text.replace(old1, new1)

          path.write_text(text, encoding="utf-8")

          print("")
          print("GiftBottomSheet.kt fixed successfully.")
          PY

          echo ""
          echo "Checking for remaining coinPrice references..."

          if grep -n -E '\bcoinPrice\b' "$FILE"; then
            echo ""
            echo "ERROR: coinPrice still exists in GiftBottomSheet.kt."
            exit 1
          fi

          echo "No coinPrice references remain."


      # ============================================================
      # 13. SHOW FIXED SOURCE
      # ============================================================
      - name: Verify fixed GiftBottomSheet
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/example/ui/gift/GiftBottomSheet.kt"

          echo "Relevant section around gift price:"
          nl -ba "$FILE" | sed -n '94,104p'

          echo ""
          echo "Relevant section around selected price:"
          nl -ba "$FILE" | sed -n '154,163p'


      # ============================================================
      # 14. VERIFY GRADLE
      # ============================================================
      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version


      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================
      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail

          echo ""
          echo "=============================================="
          echo "         BAATLY RELEASE APK BUILD"
          echo "=============================================="
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all \
            2>&1 | tee "$RUNNER_TEMP/baatly-build.log"

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=============================================="
            echo "             BAATLY BUILD FAILED"
            echo "=============================================="
            echo ""

            echo "REAL COMPILER ERRORS:"
            echo ""

            grep -n -E \
              "e: |error: |Unresolved reference|unresolved reference|Type mismatch|Compilation error|FAILURE:" \
              "$RUNNER_TEMP/baatly-build.log" \
              | tail -200 || true

            echo ""
            echo "LAST 250 LOG LINES:"
            echo ""

            tail -250 "$RUNNER_TEMP/baatly-build.log" || true

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "=============================================="
          echo "       GRADLE BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""


      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            echo ""

            find app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "            APK GENERATED"
          echo "=============================================="
          echo ""

          ls -lh "$APK"


      # ============================================================
      # 17. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK signature verified successfully."


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload Baatly APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
