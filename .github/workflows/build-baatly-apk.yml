name: Build Baatly Release APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. USE PREINSTALLED ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Android SDK directories:"
          ls -la "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed Android platforms:"
          ls -d "$ANDROID_SDK_ROOT"/platforms/* 2>/dev/null || true

          echo ""
          echo "Installed Build Tools:"
          ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null || true

          echo ""
          echo "Checking required Android 36.1 platform..."

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36.1" ]; then
            echo "ERROR: android-36.1 is missing."
            exit 1
          fi

          echo "android-36.1 FOUND."

          echo ""
          echo "Checking Build Tools..."

          if [ -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            echo "Build Tools 36.0.0 FOUND."
            echo "BUILD_TOOLS_VERSION=36.0.0" >> "$GITHUB_ENV"

          elif [ -x "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" ]; then
            echo "Build Tools 36.1.0 FOUND."
            echo "BUILD_TOOLS_VERSION=36.1.0" >> "$GITHUB_ENV"

          else
            echo "ERROR: Required Build Tools 36.x not found."
            exit 1
          fi

          echo ""
          echo "Android SDK is ready."


      # ============================================================
      # 4. FIND THE ONE BAATLY ZIP
      # ============================================================
      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print | sort
          )

          echo "ZIP files found:"
          printf '%s\n' "${ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Exactly ONE Baatly ZIP is required."
            exit 1
          fi

          echo "SOURCE_ZIP=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

          echo ""
          echo "Using:"
          echo "${ZIP_FILES[0]}"


      # ============================================================
      # 5. TEST ZIP
      # ============================================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ZIP"

          echo ""
          echo "ZIP integrity OK."


      # ============================================================
      # 6. EXTRACT ZIP
      # ============================================================
      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP extracted successfully."


      # ============================================================
      # 7. FIND GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo ""
            echo "ERROR: Expected exactly one gradlew."

            printf '%s\n' "${GRADLEW_FILES[@]}"

            exit 1
          fi

          GRADLEW="${GRADLEW_FILES[0]}"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo ""
          echo "BAATLY PROJECT:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project verified."


      # ============================================================
      # 8. CHECK SIGNING SECRETS
      # ============================================================
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          }

          echo "Signing secrets OK."


      # ============================================================
      # 9. RESTORE KEYSTORE
      # ============================================================
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

          echo "Keystore restored."


      # ============================================================
      # 10. VERIFY KEYSTORE
      # ============================================================
      - name: Verify keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Keystore verified."


      # ============================================================
      # 11. FIX CONFIRMED coinPrice ERROR
      # ============================================================
      - name: Fix GiftBottomSheet coinPrice
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/example/ui/gift/GiftBottomSheet.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: GiftBottomSheet.kt not found."

            find app/src \
              -type f \
              -name "GiftBottomSheet.kt" \
              -print

            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])

          text = file.read_text(encoding="utf-8")

          # Replace every coinPrice access with the actual
          # GiftItem property used by this project.
          text = text.replace(
              "gift.coinPrice.toDouble()",
              "gift.priceRupees"
          )

          text = text.replace(
              "it.coinPrice.toDouble()",
              "it.priceRupees"
          )

          text = text.replace(
              ".coinPrice.toDouble()",
              ".priceRupees"
          )

          file.write_text(text, encoding="utf-8")

          print("GiftBottomSheet.kt patched.")
          PY

          if grep -n "coinPrice" "$FILE"; then
            echo ""
            echo "ERROR: coinPrice still exists."
            exit 1
          fi

          echo "coinPrice references removed."


      # ============================================================
      # 12. SHOW JAVA / GRADLE VERSION
      # ============================================================
      - name: Verify Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          ./gradlew --version


      # ============================================================
      # 13. BUILD APK
      # ============================================================
      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail

          echo ""
          echo "=========================================="
          echo "      BAATLY RELEASE APK BUILD"
          echo "=========================================="
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all \
            2>&1 | tee "$RUNNER_TEMP/baatly-build.log"

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "             BUILD FAILED"
            echo "=========================================="
            echo ""

            echo "ACTUAL COMPILER ERRORS:"
            echo ""

            grep -n -E \
              "e: |error: |Unresolved reference|Type mismatch|Compilation error|FAILURE:" \
              "$RUNNER_TEMP/baatly-build.log" \
              | tail -200 || true

            echo ""
            echo "LAST LOG:"
            tail -250 "$RUNNER_TEMP/baatly-build.log" || true

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 14. VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."

            find app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          ls -lh "$APK"


      # ============================================================
      # 15. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload Baatly APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
