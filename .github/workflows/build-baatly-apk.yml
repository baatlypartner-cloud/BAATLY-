name: Build Baatly Release APK

on:
  workflow_dispatch:

  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | sort
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Exactly ONE Baatly ZIP is required."
            echo
            echo "ZIP files found:"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "SOURCE_ZIP=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

          echo "Using:"
          echo "${ZIP_FILES[0]}"


      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ZIP"


      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly"

          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"


      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew."
            printf '%s\n' "${GRADLEW_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${GRADLEW_FILES[0]}")"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Baatly project:"
          echo "$PROJECT_DIR"


      - name: Find Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null \
              | head -n 1 || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"


      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"


      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE_BASE64 missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "STORE_PASSWORD missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "KEY_PASSWORD missing"
            exit 1
          }


      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        shell: bash

        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"


      - name: Verify keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Keystore verified."


      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          java -version

          ./gradlew --version


      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash

        run: |
          set -o pipefail

          echo "=========================================="
          echo "BAATLY RELEASE APK BUILD"
          echo "=========================================="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$RUNNER_TEMP/baatly-build.log"

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "KOTLIN/GRADLE BUILD FAILED"
            echo "=========================================="
            echo

            echo "Compiler errors:"
            grep -n -E \
              "e: |error: |Unresolved reference|unresolved reference|Compilation error" \
              "$RUNNER_TEMP/baatly-build.log" \
              | tail -100 \
              || true

            exit "$EXIT_CODE"
          fi


      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"


      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"


      - name: Upload Baatly APK
        uses: actions/upload-artifact@v4

        with:
          name: baatly-release-apk

          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 30
