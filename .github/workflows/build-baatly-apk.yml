name: Build Baatly Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # 2. INSPECT REPOSITORY
      # ==========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Repository root contents:"
          ls -lah

          echo
          echo "ZIP files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -print \
            | sort

      # ==========================================================
      # 3. FIND BAATLY USER ZIP
      # ==========================================================
      - name: Locate Baatly ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | sort
          )

          echo "ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo
          echo "Found ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          # Prefer Baatly User ZIP.
          # Exclude Partner ZIP.
          mapfile -t BAATLY_ZIPS < <(
            printf '%s\n' "${ZIP_FILES[@]}" \
              | grep -Ei '/?[^/]*baatly[^/]*\.zip$' \
              | grep -Eiv 'baatly[-_ ]?partner' \
              || true
          )

          if [ "${#BAATLY_ZIPS[@]}" -eq 1 ]; then
            SELECTED_ZIP="${BAATLY_ZIPS[0]}"

          elif [ "${#BAATLY_ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Baatly User ZIP was found."
            echo "Please keep only one Baatly User source ZIP in the repository."
            printf '%s\n' "${BAATLY_ZIPS[@]}"
            exit 1

          elif [ "${#ZIP_FILES[@]}" -eq 1 ]; then
            SELECTED_ZIP="${ZIP_FILES[0]}"

          else
            echo "ERROR: Multiple ZIP files found and none clearly identifies Baatly User."
            echo "Please keep exactly one Baatly User Android project ZIP in the repository."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo
          echo "Selected source ZIP:"
          echo "$SELECTED_ZIP"

          echo "SOURCE_ZIP=$SELECTED_ZIP" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. EXTRACT ZIP
      # ==========================================================
      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo
          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find "$EXTRACT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -400

      # ==========================================================
      # 5. LOCATE ACTUAL GRADLE PROJECT
      # ==========================================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$RUNNER_TEMP/baatly-project" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          if [ "${#GRADLEW_FILES[@]}" -eq 0 ]; then
            echo "ERROR: gradlew was not found inside the uploaded ZIP."

            echo
            echo "Gradle files found:"
            find "$RUNNER_TEMP/baatly-project" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print \
              | sort

            exit 1
          fi

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew but found:"
            printf '%s\n' "${GRADLEW_FILES[@]}"
            exit 1
          fi

          GRADLEW_PATH="${GRADLEW_FILES[0]}"
          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo
          echo "Actual Android project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. VERIFY PROJECT CONFIGURATION
      # ==========================================================
      - name: Verify Baatly project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          echo
          echo "Gradle wrapper:"
          grep '^distributionUrl=' \
            gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Android project:"
          grep -nE \
            'namespace|applicationId|compileSdk|minorApiLevel|targetSdk|versionCode|versionName' \
            app/build.gradle.kts \
            || true

          echo
          echo "Signing configuration:"
          grep -nE \
            'KEYSTORE_PATH|STORE_PASSWORD|keyAlias|KEY_PASSWORD' \
            app/build.gradle.kts \
            || true

      # ==========================================================
      # 7. SETUP JAVA 17
      # ==========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 8. VERIFY JAVA
      # ==========================================================
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

      # ==========================================================
      # 9. SETUP ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      # ==========================================================
      # 10. FIND SDKMANAGER
      # ==========================================================
      - name: Locate sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ==========================================================
      # 11. INSTALL REQUIRED SDK
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # ==========================================================
      # 12. ADD BUILD TOOLS TO PATH
      # ==========================================================
      - name: Add Android Build Tools to PATH
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android Build Tools directory not found:"
            echo "$BUILD_TOOLS_DIR"
            exit 1
          fi

          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          echo "Android Build Tools added to PATH:"
          echo "$BUILD_TOOLS_DIR"

      # ==========================================================
      # 13. VERIFY ANDROID SDK + APKSIGNER
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36.1"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          echo
          echo "Android SDK verification PASSED."

          echo
          echo "apksigner version:"
          "$APKSIGNER" --version

      # ==========================================================
      # 14. CHECK SIGNING SECRETS
      # ==========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "All required signing secrets are present."

      # ==========================================================
      # 15. RESTORE RELEASE KEYSTORE
      # ==========================================================
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$PWD/my-upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Restored keystore is empty."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo
          echo "Release keystore restored:"
          ls -lh "$KEYSTORE_FILE"

      # ==========================================================
      # 16. VERIFY RELEASE KEYSTORE
      # ==========================================================
      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore ./my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            > /tmp/keytool-output.txt

          echo "Release keystore verified."
          echo "Key alias 'upload' verified."

      # ==========================================================
      # 17. VERIFY GRADLE
      # ==========================================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

      # ==========================================================
      # 18. BUILD SIGNED RELEASE APK
      #
      # APK = assembleRelease
      # ==========================================================
      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "          BAATLY RELEASE APK BUILD"
          echo "================================================"

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================================
      # 19. VERIFY GENERATED APK
      # ==========================================================
      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not generated:"
            echo "$APK_FILE"

            echo
            echo "Searching for generated APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo
          echo "Baatly APK generated successfully:"
          ls -lh "$APK_FILE"

      # ==========================================================
      # 20. VERIFY APK SIGNATURE
      #
      # IMPORTANT:
      # Use absolute path so PATH issues cannot break this step.
      # ==========================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK not found:"
            echo "$APK_FILE"
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          echo "Verifying APK signature..."

          "$APKSIGNER" verify --verbose "$APK_FILE"

          echo
          echo "APK signature verification PASSED."

      # ==========================================================
      # 21. PREPARE APK ARTIFACT
      # ==========================================================
      - name: Prepare Baatly APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-artifacts
          mkdir -p release-artifacts

          cp \
            app/build/outputs/apk/release/app-release.apk \
            release-artifacts/baatly-release.apk

          echo
          echo "Prepared APK:"
          ls -lh release-artifacts/baatly-release.apk

      # ==========================================================
      # 22. UPLOAD APK
      # ==========================================================
      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/release-artifacts/baatly-release.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 23. SUCCESS
      # ==========================================================
      - name: Build Success
        shell: bash
        run: |
          echo "================================================"
          echo "        BAATLY APK BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Output:"
          echo "${{ env.PROJECT_DIR }}/release-artifacts/baatly-release.apk" 
