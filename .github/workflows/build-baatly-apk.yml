name: Build Baatly Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "*/.git/*" \
              -print \
              | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one ZIP file."

            printf '%s\n' "${ZIPS[@]}"

            exit 1
          fi

          echo "SOURCE_ZIP=${ZIPS[0]}" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "${ZIPS[0]}"

      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/baatly"

          mkdir -p "$RUNNER_TEMP/baatly"

          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/baatly"

          PROJECT_DIR="$(
            find "$RUNNER_TEMP/baatly" \
              -type f \
              -name gradlew \
              -print \
              -quit \
              | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Prepare Baatly Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP="app/build.gradle.kts"
          ROOT="build.gradle.kts"

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP"

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp)/d' \
            "$APP"

          sed -i \
            '/alias(libs.plugins.ksp)/d' \
            "$APP"

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp) apply false/d' \
            "$ROOT"

          sed -i \
            '/moshi.kotlin.codegen/d' \
            "$APP"

          if ! grep -q \
            'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' \
            "$APP"; then

            printf '\n%s\n' \
              'kotlin {' \
              '    compilerOptions {' \
              '        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' \
              '    }' \
              '}' >> "$APP"

          fi

          echo "Gradle configuration prepared."

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          }

          echo "Signing secrets are present."

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

          echo "Keystore restored."

      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Keystore verified."

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          java -version

          ./gradlew --version

      - name: Clean Baatly project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING BAATLY RELEASE APK"
          echo "========================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Success
        shell: bash
        run: |
          echo "========================================"
          echo "BAATLY APK BUILD SUCCESS"
          echo "========================================"
          echo "Artifact: baatly-release-apk"
