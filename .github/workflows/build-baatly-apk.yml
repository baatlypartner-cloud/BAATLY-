name: Build Baatly Release APK

on:
  workflow_dispatch:

  push:


permissions:
  contents: read


jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8


    steps:

      # ---------------------------------------------------------
      # 1. Checkout GitHub repository
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 4. Install SDK required by Baatly
      # ---------------------------------------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"


      # ---------------------------------------------------------
      # 5. Find the uploaded Baatly ZIP
      # ---------------------------------------------------------

      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | grep -Ei '/[^/]*baatly[^/]*\.zip$' \
              | grep -Eiv 'partner' \
              | sort
          )

          echo "Baatly ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No Baatly ZIP found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one Baatly ZIP found."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "SOURCE_ZIP=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

          echo
          echo "Using Baatly ZIP:"
          echo "${ZIP_FILES[0]}"


      # ---------------------------------------------------------
      # 6. Extract ZIP
      # ---------------------------------------------------------

      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo "ZIP extracted successfully."


      # ---------------------------------------------------------
      # 7. Find actual Gradle project
      # ---------------------------------------------------------

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          echo "gradlew files found: ${#GRADLEW_FILES[@]}"

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew."

            printf '%s\n' "${GRADLEW_FILES[@]}"

            exit 1
          fi

          PROJECT_DIR="$(dirname "${GRADLEW_FILES[0]}")"

          echo
          echo "Baatly Gradle project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 8. Fix the build configuration inside temporary copy
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      # Original ZIP is NOT modified in GitHub.
      # Only the extracted temporary copy is patched for CI.
      #
      # Original ZIP uses Java 11.
      # GitHub build uses JDK 17.
      # Align Kotlin + Java to JVM 17.
      #
      # Original project also contains unused Moshi KSP setup.
      # Source inspection shows no @JsonClass code-generation usage.
      # ---------------------------------------------------------

      - name: Prepare Baatly build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APP_FILE="app/build.gradle.kts"
          ROOT_FILE="build.gradle.kts"

          echo "Preparing temporary CI build..."


          # -------------------------------------------------------
          # Java 11 -> Java 17
          # -------------------------------------------------------

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP_FILE"


          # -------------------------------------------------------
          # Remove unused KSP plugin from app
          # -------------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp)/d' \
            "$APP_FILE"


          # -------------------------------------------------------
          # Remove unused KSP plugin from root project
          # -------------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp) apply false/d' \
            "$ROOT_FILE"


          # -------------------------------------------------------
          # Remove Moshi KSP processor
          # -------------------------------------------------------

          sed -i \
            '/"ksp"(libs.moshi.kotlin.codegen)/d' \
            "$APP_FILE"


          # -------------------------------------------------------
          # Explicit Kotlin JVM 17 target
          # -------------------------------------------------------

          if ! grep -q \
            'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' \
            "$APP_FILE"; then

            printf '%s\n' \
              '' \
              'kotlin {' \
              '  compilerOptions {' \
              '    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' \
              '  }' \
              '}' >> "$APP_FILE"

          fi


          echo
          echo "Build configuration prepared."


      # ---------------------------------------------------------
      # 9. Check signing secrets
      # ---------------------------------------------------------

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets found."


      # ---------------------------------------------------------
      # 10. Restore release keystore
      # ---------------------------------------------------------

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

          echo "Release keystore restored."


      # ---------------------------------------------------------
      # 11. Verify keystore
      # ---------------------------------------------------------

      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Release keystore verified."


      # ---------------------------------------------------------
      # 12. Verify Gradle
      # ---------------------------------------------------------

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version


      # ---------------------------------------------------------
      # 13. Clean
      # ---------------------------------------------------------

      - name: Clean Baatly project
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ---------------------------------------------------------
      # 14. Build release APK
      # ---------------------------------------------------------

      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================"
          echo "       BAATLY RELEASE APK BUILD"
          echo "============================================"
          echo

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ---------------------------------------------------------
      # 15. Check generated APK
      # ---------------------------------------------------------

      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then

            echo "ERROR: Release APK was not generated."

            echo
            echo "APK files found:"

            find app/build \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo
          echo "APK generated successfully:"
          ls -lh "$APK_FILE"


      # ---------------------------------------------------------
      # 16. Verify APK signature
      # ---------------------------------------------------------

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK_FILE"

          echo
          echo "APK signature verification PASSED."


      # ---------------------------------------------------------
      # 17. Upload APK
      # ---------------------------------------------------------

      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4

        with:
          name: baatly-release-apk

          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 30


      # ---------------------------------------------------------
      # 18. Success
      # ---------------------------------------------------------

      - name: Build Success
        shell: bash
        run: |
          echo
          echo "============================================"
          echo "     BAATLY APK BUILD SUCCESS"
          echo "============================================"
          echo
          echo "Artifact:"
          echo "baatly-release-apk" 
