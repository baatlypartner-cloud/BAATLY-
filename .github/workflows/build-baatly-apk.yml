name: Build Baatly Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. SETUP JAVA 17
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 3. SETUP ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. INSTALL REQUIRED SDK
      # =========================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"


      # =========================================================
      # 5. FIND BAATLY ZIP
      # =========================================================

      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | grep -Ei '/[^/]*baatly[^/]*\.zip$' \
              | grep -Eiv 'partner' \
              | sort
          )

          echo "Baatly ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Baatly ZIP was not found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one Baatly ZIP was found."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "SOURCE_ZIP=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

          echo "Selected ZIP:"
          echo "${ZIP_FILES[0]}"


      # =========================================================
      # 6. EXTRACT ZIP
      # =========================================================

      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$RUNNER_TEMP/baatly-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q "$SOURCE_ZIP" -d "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "ZIP extracted successfully."


      # =========================================================
      # 7. FIND ACTUAL GRADLE PROJECT
      # =========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          mapfile -t GRADLE_WRAPPERS < <(
            find "$PROJECT_ROOT" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          if [ "${#GRADLE_WRAPPERS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew."
            printf '%s\n' "${GRADLE_WRAPPERS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${GRADLE_WRAPPERS[0]}")"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Actual Baatly project:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 8. FIX BUILD CONFIG INSIDE EXTRACTED ZIP
      #    USER DOES NOT NEED TO EDIT THE ZIP
      # =========================================================

      - name: Fix Baatly Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP="app/build.gradle.kts"
          ROOT="build.gradle.kts"
          CATALOG="gradle/libs.versions.toml"

          echo "Applying build fixes..."

          # -----------------------------------------------------
          # Remove KSP plugin from app
          # -----------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp)/d' \
            "$APP"

          # -----------------------------------------------------
          # Remove Moshi KSP dependency
          # -----------------------------------------------------

          sed -i \
            '/^[[:space:]]*"ksp"(libs.moshi.kotlin.codegen)$/d' \
            "$APP"

          # -----------------------------------------------------
          # Change Java 11 -> Java 17
          # -----------------------------------------------------

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP"

          # -----------------------------------------------------
          # Add Kotlin JVM 17 compiler target
          # -----------------------------------------------------

          if ! grep -q 'jvmTarget.set(JvmTarget.JVM_17)' "$APP"; then

            python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle.kts")
s = p.read_text()

if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in s:
    s = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n" + s

marker = """  buildFeatures {
"""

block = """  kotlin {
    compilerOptions {
      jvmTarget.set(JvmTarget.JVM_17)
    }
  }

"""

if "jvmTarget.set(JvmTarget.JVM_17)" not in s:
    if marker in s:
        s = s.replace(marker, block + marker, 1)
    else:
        raise SystemExit("Could not find buildFeatures block in app/build.gradle.kts")

p.write_text(s)
PY

          fi

          # -----------------------------------------------------
          # Remove KSP from ROOT build.gradle.kts
          # -----------------------------------------------------

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp) apply false/d' \
            "$ROOT"

          # -----------------------------------------------------
          # Remove KSP plugin from version catalog
          # -----------------------------------------------------

          sed -i \
            '/google-devtools-ksp[[:space:]]*=/d' \
            "$CATALOG"

          # -----------------------------------------------------
          # Remove KSP version
          # -----------------------------------------------------

          sed -i \
            '/googleDevtoolsKsp[[:space:]]*=/d' \
            "$CATALOG"

          echo
          echo "========================================"
          echo "FIXED APP GRADLE"
          echo "========================================"

          cat "$APP"

          echo
          echo "========================================"
          echo "KSP REFERENCES AFTER FIX"
          echo "========================================"

          if grep -RIn \
            "google.devtools.ksp\|symbol-processing\|moshi.kotlin.codegen" \
            app build.gradle.kts gradle/libs.versions.toml \
            2>/dev/null; then

            echo "ERROR: KSP references still exist."
            exit 1

          fi

          echo "KSP references removed."


      # =========================================================
      # 9. VERIFY JAVA / GRADLE
      # =========================================================

      - name: Verify Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version


      # =========================================================
      # 10. CHECK SIGNING SECRETS
      # =========================================================

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD secret missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          }

          echo "All signing secrets are present."


      # =========================================================
      # 11. RESTORE KEYSTORE
      # =========================================================

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        shell: bash
        run: |
          set -e

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "Keystore restored successfully."


      # =========================================================
      # 12. VERIFY KEYSTORE
      # =========================================================

      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Keystore verified."


      # =========================================================
      # 13. CLEAN
      # =========================================================

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 14. BUILD RELEASE APK
      # =========================================================

      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "BAATLY RELEASE BUILD"
          echo "========================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all


      # =========================================================
      # 15. FIND APK
      # =========================================================

      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: app-release.apk was not generated."
            exit 1
          fi

          echo
          echo "APK successfully generated:"
          ls -lh "$APK"


      # =========================================================
      # 16. VERIFY SIGNATURE
      # =========================================================

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo
          echo "APK signature verification PASSED."


      # =========================================================
      # 17. PREPARE ARTIFACT
      # =========================================================

      - name: Prepare APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          mkdir -p release-artifacts

          cp \
            app/build/outputs/apk/release/app-release.apk \
            release-artifacts/baatly-release.apk

          ls -lh release-artifacts/baatly-release.apk


      # =========================================================
      # 18. UPLOAD APK
      # =========================================================

      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/release-artifacts/baatly-release.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 19. SUCCESS
      # =========================================================

      - name: Build Success
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "BAATLY APK BUILD SUCCESS"
          echo "========================================"
          echo
          echo "Download artifact:"
          echo "baatly-release-apk" 
