name: Build Baatly Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP"

      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/baatly"

          mkdir -p "$RUNNER_TEMP/baatly"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/baatly"

          GRADLEW=$(find "$RUNNER_TEMP/baatly" \
            -type f \
            -name gradlew \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP="app/build.gradle.kts"

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP"

          sed -i \
            '/alias(libs.plugins.google.devtools.ksp)/d' \
            "$APP"

          sed -i \
            '/alias(libs.plugins.ksp)/d' \
            "$APP"

          sed -i \
            '/moshi.kotlin.codegen/d' \
            "$APP"

          if ! grep -q "jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)" "$APP"; then
            printf '\n' >> "$APP"
            printf 'kotlin {\n' >> "$APP"
            printf '    compilerOptions {\n' >> "$APP"
            printf '        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n' >> "$APP"
            printf '    }\n' >> "$APP"
            printf '}\n' >> "$APP"
          fi

          echo "Gradle configuration prepared."

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets OK."

      - name: Restore keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          test -s my-upload-key.jks

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Verify keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Keystore OK."

      - name: Show Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          java -version

          ./gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILDING BAATLY RELEASE APK"
          echo "================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"

            find . \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK created:"
          ls -lh "$APK"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baatly-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Success
        run: |
          echo "================================"
          echo "BAATLY BUILD SUCCESS"
          echo "================================"
