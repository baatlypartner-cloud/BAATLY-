name: Build Baatly Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Baatly Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      - name: Find Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null \
              | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 || true


      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          echo "Android SDK installation complete."


      - name: Find Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              ! -path "*/.git/*" \
              -print \
              | sort
          )

          echo "ZIP files found: ${#ZIP_FILES[@]}"

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Exactly one ZIP file is required."

            printf '%s\n' "${ZIP_FILES[@]}"

            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[0]}"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Selected Baatly ZIP:"
          echo "$SOURCE_ZIP"


      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$SOURCE_ZIP"


      - name: Extract Baatly ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/baatly-project"

          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          unzip -q "$SOURCE_ZIP" \
            -d "$EXTRACT_DIR"

          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

          echo "ZIP extracted."


      - name: Locate actual Gradle project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t GRADLEW_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name "gradlew" \
              -print \
              | sort
          )

          echo "gradlew files found: ${#GRADLEW_FILES[@]}"

          if [ "${#GRADLEW_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one gradlew inside ZIP."

            printf '%s\n' "${GRADLEW_FILES[@]}"

            exit 1
          fi

          PROJECT_DIR="$(dirname "${GRADLEW_FILES[0]}")"

          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Actual Android project:"
          echo "$PROJECT_DIR"


      - name: Prepare Baatly build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build.gradle.kts"

          ROOT="build.gradle.kts"

          CATALOG="gradle/libs.versions.toml"


          echo "Applying CI build fixes..."


          # Java 11 -> Java 17
          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP"


          # Remove KSP plugin from app
          sed -i \
            '/google.devtools.ksp/d' \
            "$APP"


          # Remove KSP plugin from root build file
          sed -i \
            '/google.devtools.ksp/d' \
            "$ROOT"


          # Remove Moshi KSP dependency
          sed -i \
            '/moshi.kotlin.codegen/d' \
            "$APP"


          # Remove unused KSP entries from version catalog
          sed -i \
            '/googleDevtoolsKsp[[:space:]]*=/d' \
            "$CATALOG"

          sed -i \
            '/google-devtools-ksp[[:space:]]*=/d' \
            "$CATALOG"


          # Remove unused Moshi codegen version/dependency
          sed -i \
            '/moshiKotlinCodegen[[:space:]]*=/d' \
            "$CATALOG"

          sed -i \
            '/moshi-kotlin-codegen[[:space:]]*=/d' \
            "$CATALOG"


          # Add Kotlin JVM 17 target
          if ! grep -q \
            'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' \
            "$APP"; then

            printf '\n' >> "$APP"
            printf 'kotlin {\n' >> "$APP"
            printf '    compilerOptions {\n' >> "$APP"
            printf '        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n' >> "$APP"
            printf '    }\n' >> "$APP"
            printf '}\n' >> "$APP"

          fi


          echo "Baatly build configuration prepared."


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version


      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Release signing secrets are present."


      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        shell: bash

        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

          echo "Release keystore restored."


      - name: Verify release keystore
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Release keystore verified."


      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version


      - name: Clean Baatly project
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Baatly Release APK
        working-directory: ${{ env.PROJECT_DIR }}

        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       BAATLY RELEASE APK BUILD"
          echo "=============================================="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      - name: Verify generated APK
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching for APK files..."

            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo "APK generated successfully:"

          ls -lh "$APK"


      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}

        shell: bash

        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verification PASSED."


      - name: Upload Baatly Release APK
        uses: actions/upload-artifact@v4

        with:
          name: baatly-release-apk

          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 30


      - name: Build Success
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "      BAATLY RELEASE APK BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Artifact: baatly-release-apk"
